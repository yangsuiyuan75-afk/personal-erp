services:
  postgres:
    image: postgres:17
    container_name: personal-erp-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-personal_erp}
      POSTGRES_USER: ${POSTGRES_USER:-personal_erp}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - '${POSTGRES_PORT:-5432}:5432'
    volumes:
      - personal_erp_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'pg_isready -U ${POSTGRES_USER:-personal_erp} -d ${POSTGRES_DB:-personal_erp}',
        ]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  personal_erp_postgres_data:
