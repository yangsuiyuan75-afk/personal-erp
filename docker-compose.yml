services:
  postgres:
    image: postgres:17-alpine
    container_name: personal-erp-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-personal_erp}
      POSTGRES_USER: ${POSTGRES_USER:-personal_erp}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - '${POSTGRES_PORT:-5432}:5432'
    volumes:
      - personal_erp_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'pg_isready -U ${POSTGRES_USER:-personal_erp} -d ${POSTGRES_DB:-personal_erp}',
        ]
      interval: 5s
      timeout: 5s
      retries: 10

  postgres-test:
    image: postgres:17-alpine
    container_name: personal-erp-postgres-test
    profiles: ['test']
    environment:
      POSTGRES_DB: personal_erp_test
      POSTGRES_USER: personal_erp_test
      POSTGRES_PASSWORD: personal_erp_test
    ports:
      - '${POSTGRES_TEST_PORT:-5433}:5432'
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U personal_erp_test -d personal_erp_test']
      interval: 2s
      timeout: 3s
      retries: 20

volumes:
  personal_erp_postgres_data:
